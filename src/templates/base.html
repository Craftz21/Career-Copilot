<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CareerCopilot{% endblock %}</title>
  <meta name="description" content="AI-powered skill gap analysis and personalized learning roadmap for your target role." />

  <!-- Tailwind CSS via CDN (swap for compiled CSS in prod) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
          }
        }
      }
    }
  </script>

  <style>
    .progress-bar { transition: width 0.4s ease; }
    .skill-chip { @apply inline-flex items-center px-3 py-1 rounded-full text-sm font-medium; }
    .fade-in { animation: fadeIn 0.4s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  {% block head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans antialiased">

  <!-- Nav -->
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 font-bold text-lg text-brand-600 hover:text-brand-700">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
        CareerCopilot
      </a>
      <div class="text-sm text-slate-500">AI Career Intelligence</div>
    </div>
  </nav>

  <!-- Main -->
  <main class="max-w-5xl mx-auto px-4 py-10">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-200 mt-16 py-6 text-center text-sm text-slate-400">
    <p>CareerCopilot &mdash; Built with FastAPI, pgvector &amp; Groq</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
